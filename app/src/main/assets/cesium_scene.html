  @keyframes p{0%,80%,100%{opacity:.3}40%{opacity:1}}

    upsertDrawing(arg){const d=_parse(arg);if(!d||!d.uid||!d.kind||!Array.isArray(d.coords)||d.coords.length===0)return;const v=_state.viewer;if(!v)return;
